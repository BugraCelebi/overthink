app = "overthinkapp"
primary_region = "ams"

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/overthink.db"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "overthink_data"
  destination = "/data"
